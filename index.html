<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Hartmann Outreach Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#0e1116;--bg2:#151a21;--panel:#1a202a;--panel2:#212a37;--border:#2b3544;
  --text:#e7ecf3;--muted:#8d99ab;--accent:#4f8cff;--accent2:#3d74e0;
  --danger:#ff6b6b;--warn:#f5b942;--ok:#3ddc97;--info:#7cc4ff;
  --chip-bg:rgba(255,255,255,.06);--shadow:0 14px 40px rgba(0,0,0,.45)
}
html.light{
  --bg:#f3f5f9;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef1f7;--border:#dce2ec;
  --text:#19212e;--muted:#5f6b7d;--chip-bg:rgba(0,0,0,.05);--shadow:0 14px 40px rgba(25,40,70,.14)
}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-weight:700}
.hidden{display:none !important}
.app{display:flex;min-height:100vh;align-items:stretch}

.sidebar{width:252px;flex:0 0 252px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7b5cff);display:grid;place-items:center;font-weight:800;color:#fff}
.brand-name{font-weight:700;font-size:14.5px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13.5px}
.nav-btn:hover{background:var(--panel);color:var(--text)}
.nav-btn.active{background:rgba(79,140,255,.15);color:var(--accent)}
.side-section-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mini-add{background:transparent;border:1px solid var(--border);border-radius:6px;width:22px;height:22px;line-height:1;font-size:13px;color:var(--muted);display:grid;place-items:center}
.mini-add:hover{color:var(--accent);border-color:var(--accent)}
.projects-list{display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px;overflow-y:auto}
.project-row{display:flex;justify-content:space-between;gap:8px;align-items:center;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:13px;color:var(--text);text-align:left}
.project-row:hover{background:var(--panel)}
.project-row.active{background:var(--panel);border-color:var(--border)}
.project-row-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-row-count{background:var(--chip-bg);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--muted);flex:0 0 auto}
.side-foot{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:9px}
.save-status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;cursor:default;min-height:16px}
.save-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 8px}
.save-status.saving{color:var(--warn)}.save-status.saving::before{background:var(--warn)}
.save-status.saved::before{background:var(--ok)}
.save-status.error{color:var(--danger);cursor:pointer;text-decoration:underline dotted}.save-status.error::before{background:var(--danger)}
.side-actions{display:flex;flex-wrap:wrap;gap:6px}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 22px 12px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:20}
.topbar h1{margin:0;font-size:19px}
.subtitle{font-size:12.5px;color:var(--muted)}
.topbar-actions{display:flex;gap:8px;align-items:center;position:relative}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:15px;color:var(--muted);padding:0}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
.menu{position:absolute;top:44px;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:190px;padding:6px;z-index:30}
.menu button{background:none;border:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text)}
.menu button:hover{background:var(--panel2)}

.primary-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;white-space:nowrap}
.primary-btn:hover{background:var(--accent2);border-color:var(--accent2)}
.primary-btn.ghost{background:transparent;color:var(--text);border-color:var(--border);padding:7px 13px;font-size:13px}
.primary-btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.ghost-btn{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ghost-btn:hover{color:var(--text);border-color:var(--accent)}
.ghost-btn.danger:hover{color:var(--danger);border-color:var(--danger)}

.view{padding:18px 22px 44px;min-width:0}
.banner{background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.4);color:var(--text);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat-value{font-size:28px;font-weight:800;line-height:1.15}
.stat-label{font-size:12px;color:var(--muted)}
.stat-card.alert{border-color:rgba(255,107,107,.5)}
.stat-card.alert .stat-value{color:var(--danger)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-head h3{margin:0;font-size:14px}
.panel-body{padding:10px 16px 14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pipe-row{display:grid;grid-template-columns:175px 1fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.pipe-bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
.pipe-fill{display:block;height:100%;border-radius:6px}
.pipe-count{text-align:right;color:var(--muted)}
.mini-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.mini-row:last-child{border-bottom:none}
.mini-row[data-action]{cursor:pointer}
.mini-row[data-action]:hover{color:var(--accent)}
.mini-date{color:var(--muted);font-size:11.5px;min-width:76px;flex:0 0 auto}
.mini-main{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-sub{color:var(--muted);font-weight:400;font-size:11.5px}
.mini-note{color:var(--muted);font-size:12px;text-align:right;max-width:55%}
.mini-note.overdue,.overdue{color:var(--danger);font-weight:600}
.empty-mini{font-size:12.5px;color:var(--muted);padding:6px 2px}
.empty-state{text-align:center;padding:54px 20px;border:1px dashed var(--border);border-radius:14px;background:var(--panel);color:var(--muted)}
.empty-state p{margin:0 0 14px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.input-search{flex:1;min-width:180px;max-width:330px}
.spacer{flex:1}
.legend{font-size:12.5px;color:var(--muted)}
.check-line{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{padding:7px 9px}
textarea{min-height:76px;resize:vertical;width:100%}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);padding:0}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.data-table{width:100%;border-collapse:collapse;font-size:13.2px}
.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr[data-action]{cursor:pointer}
.data-table tbody tr[data-action]:hover{background:var(--panel2)}
.cell-name{font-weight:600}
.data-table tr.has-history td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cell-undated{color:var(--muted);font-style:italic}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);border:1px solid transparent;color:var(--text);white-space:nowrap}
.chip-plain{color:var(--muted)}
.chip-danger{color:var(--danger);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4)}
.chip-success{color:var(--ok);background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.35)}
.chip-warning{color:var(--warn);background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.35)}
.chip-info{color:var(--info);background:rgba(124,196,255,.12);border-color:rgba(124,196,255,.35)}
.muted-chip{color:var(--muted);background:transparent}
.stage-chip{color:var(--chip-color);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
html.light .stage-chip{border-color:rgba(0,0,0,.2);background:rgba(0,0,0,.04)}

.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.task-row.done{opacity:.55}
.task-check{flex:0 0 auto}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;font-size:13.4px}
.task-sub{font-size:12px;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex:0 0 auto}

.overlay{position:fixed;inset:0;background:rgba(4,8,14,.62);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
#detail-backdrop{z-index:35}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100%);background:var(--bg2);border-left:1px solid var(--border);z-index:36;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-head{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.drawer-head h2{margin:0;font-size:17px}
.drawer-body{overflow-y:auto;padding:14px 18px 48px;display:flex;flex-direction:column;gap:14px}
.detail-section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.detail-section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.detail-section-head h3{margin:0;font-size:13.5px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;justify-content:flex-end}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv.wide{grid-column:1 / -1}
.kv-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv-value{font-size:13.3px;word-break:break-word;white-space:pre-wrap}
.contact-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.contact-card.has-review{border-color:rgba(255,107,107,.45)}
.contact-card-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact-primary{font-weight:600}
.contact-secondary{color:var(--muted);font-size:12.5px}
.contact-line{font-size:12.5px;color:var(--muted);margin-top:3px}
.contact-card-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.flag-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:11px;color:var(--danger);background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);border-radius:6px;padding:1px 7px}
.engagement-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.engagement-controls label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.engagement-meta{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.engagement-block.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.legacy-box{border:1px dashed var(--border);border-radius:9px;padding:8px 12px;margin-top:8px;font-size:12.5px}
.legacy-box summary{cursor:pointer;color:var(--muted)}
.legacy-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px}
.activity-row{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.8px;align-items:center}
.activity-row:last-child{border-bottom:none}
.activity-row.undated{opacity:.75}
.activity-date{color:var(--muted);font-size:11.5px;min-width:76px}
.activity-meta{grid-column:1 / -1;color:var(--muted);font-size:11.5px}

.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(660px,100%);max-height:min(90vh,94dvh);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.modal>#modal-form{display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden;flex:1}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex:0 0 auto;background:var(--bg2)}
.modal-head h2{margin:0;font-size:16px}
.modal-body{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;align-content:start;flex:1 1 auto;min-height:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.field.wide,.check-field{grid-column:1 / -1}
.field input,.field select{width:100%;font-weight:400}
.help-text{font-weight:400;font-size:11.5px;color:var(--muted)}
.modal-divider{grid-column:1 / -1;border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex:0 0 auto;background:var(--bg2)}
.modal-error{flex:1;font-size:12.5px;color:var(--danger);background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);border-radius:8px;padding:7px 10px}
.reveal-block{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px;padding:12px;border:1px dashed var(--border);border-radius:10px;background:var(--panel)}
.reveal-block .modal-divider{border-top:none;padding-top:0}
.wizard-steps{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.wizard-steps .step{padding:3px 9px;border:1px solid var(--border);border-radius:999px}
.wizard-steps .step.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.wizard-steps .step.done{color:var(--ok);border-color:rgba(61,220,151,.5)}
.wizard-row{grid-column:1 / -1;font-size:12.5px;border-bottom:1px solid var(--border);padding:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wizard-row:last-of-type{border-bottom:none}
.map-grid{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.map-grid .field{font-size:11.5px}
.review-list{grid-column:1 / -1;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--panel);font-size:12.3px;display:flex;flex-direction:column;gap:6px}
.review-list .rline{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.review-list .rline .rname{font-weight:600}
.rline.action-create{color:var(--ok)}
.rline.action-reuse{color:var(--info)}
.rline.action-skip{color:var(--muted)}
.rline.action-reject{color:var(--danger)}
.rline.action-uncertain{color:var(--warn)}
.counts-grid{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.count-box{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted)}
.count-box strong{display:block;font-size:19px;color:var(--text)}

.card-dialog{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;width:min(460px,100%);box-shadow:var(--shadow)}
.card-dialog h2{margin:0 0 8px;font-size:17px}
.card-dialog p{color:var(--muted);font-size:13px;margin:0 0 16px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s}
.toast.show{opacity:1;transform:none}
.toast.error{border-left-color:var(--danger)}
.toast.success{border-left-color:var(--ok)}

/* ---- project management ---- */
.project-head{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.project-head-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.project-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stage-seg{flex:1 1 120px;min-width:110px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:11.6px;text-align:left;color:var(--muted);position:relative}
.stage-seg .seg-title{display:block;font-weight:700;font-size:11.8px;color:var(--text);line-height:1.25}
.stage-seg:hover{border-color:var(--accent)}
.stage-seg.current{border-color:var(--seg-color);box-shadow:inset 0 -3px 0 var(--seg-color)}
.stage-seg.current .seg-title{color:var(--seg-color)}
.stage-seg.selected{outline:2px solid var(--accent);outline-offset:1px}
.stage-detail{border:1px solid var(--accent);border-radius:12px;background:var(--panel2);padding:14px;margin-top:12px}
.stage-detail-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stage-detail-head h4{margin:0;font-size:14px}
.stage-notes{width:100%;min-height:70px;margin-top:8px}
.progress-line{font-size:12.5px;color:var(--muted)}
.agreement-panel{border-top:1px dashed var(--border);margin-top:12px;padding-top:12px}
.agreement-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.8px;color:var(--muted)}
.agreement-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.milestone-row{display:flex;gap:8px;align-items:center;font-size:12.6px;padding:5px 0;border-bottom:1px solid var(--border)}
.milestone-row:last-child{border-bottom:none}
.milestone-row .ms-label{flex:1;font-weight:600}
.history-list{font-size:12.2px;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin-top:8px}

/* ---- attention / overview ---- */
.attention-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.attention-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;position:relative}
.attention-card:hover{border-color:var(--accent)}
.attention-card.alert{border-color:rgba(255,107,107,.5)}
.attention-card .stat-value{font-size:26px}
.attention-card .stat-label{font-weight:600}
.attention-card .stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.control-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.control-row label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.control-row select,.control-row input{font-weight:400}
.view-tabs{display:flex;gap:6px;flex-wrap:wrap}
.view-tab{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}
.view-tab.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.overdue-row td{background:rgba(255,107,107,.05)}
.inline-input{padding:4px 6px;font-size:12.3px;border-radius:6px}
.inline-select{padding:4px 6px;font-size:12.3px;border-radius:6px}
.cell-sub{font-size:11.5px;color:var(--muted)}

/* ---- kanban ---- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;align-items:start}
.kanban-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:120px}
.kanban-col.drop-target{border-color:var(--accent);background:rgba(79,140,255,.07)}
.kanban-col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
.kanban-card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:12.6px;cursor:grab}
.kanban-card.dragging{opacity:.4}
.kanban-card .kc-title{font-weight:600;margin-bottom:4px}
.kanban-card .kc-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11.3px;align-items:center}

/* ---- calendar ---- */
.cal-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:6px}
.cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:104px;padding:6px;position:relative}
.cal-cell.other-month{opacity:.45}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.selected{outline:2px solid var(--accent)}
.cal-cell-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.cal-add{background:none;border:1px solid var(--border);border-radius:6px;width:20px;height:20px;line-height:1;color:var(--muted);font-size:12px;padding:0}
.cal-add:hover{color:var(--accent);border-color:var(--accent)}
.cal-item{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid transparent;border-left:3px solid var(--it-color,var(--muted));border-radius:6px;padding:2px 6px;font-size:11.2px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.cal-item:hover{border-color:var(--accent)}
.cal-item.completed{opacity:.65;text-decoration:line-through}
.cal-item.scheduled{border-left-style:dashed}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.8px;color:var(--muted);align-items:center}
.cal-legend .li{display:inline-flex;gap:5px;align-items:center}
.cal-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal-list-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.cal-list-row:last-child{border-bottom:none}
.cal-list-row .clr-date{color:var(--muted);font-size:11.8px}
.cal-list-row .clr-kind{font-size:11px}
.agenda-day{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.agenda-day:first-child{margin-top:0}

/* ---- misc additions ---- */
.chip-drafting{color:var(--warn);background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.35)}
.activity-actions{grid-column:1 / -1;display:flex;gap:6px;justify-content:flex-end}
.link-btn{background:none;border:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline}
.count-badge{display:inline-block;min-width:18px;text-align:center;background:var(--chip-bg);border-radius:9px;padding:0 6px;font-size:11px}
.my-tasks-pref{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .modal-body{grid-template-columns:1fr}
  .kv-grid,.legacy-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex:none;border-right:none;border-bottom:1px solid var(--border)}
  .projects-list{max-height:130px}
  .view{padding:14px 14px 40px}
  .topbar{padding:12px 14px 10px;flex-wrap:wrap}
  .pipe-row{grid-template-columns:110px 1fr 34px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div>
        <div class="brand-name">Hartmann</div>
        <div class="brand-sub">Outreach Tracker</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-nav="overview" data-action="open-view" data-view="overview">Overview</button>
      <button class="nav-btn" data-nav="tracker" data-action="open-view" data-view="tracker">Projects</button>
      <button class="nav-btn" data-nav="calendar" data-action="open-view" data-view="calendar">Calendar</button>
      <button class="nav-btn" data-nav="directory" data-action="open-view" data-view="directory">Investor Directory</button>
      <button class="nav-btn" data-nav="tasks" data-action="open-view" data-view="tasks">Tasks</button>
    </nav>
    <div class="side-section-head"><span>Projects</span><button class="mini-add" data-action="add-project" title="New project">+</button></div>
    <div id="projects-list" class="projects-list"></div>
    <div class="side-foot">
      <div id="save-status" class="save-status" title="Click to retry a failed save"><span id="save-status-text">Not signed in</span></div>
      <div class="side-actions">
        <button class="ghost-btn" data-action="export-json">JSON</button>
        <button class="ghost-btn" data-action="export-csv">CSV</button>
        <label class="ghost-btn file-btn">Import JSON<input type="file" id="import-json-input" accept=".json,application/json" /></label>
        <label class="ghost-btn file-btn">Import CSV<input type="file" id="import-csv-input" accept=".csv,text/csv" /></label>
        <label class="ghost-btn file-btn">Import investors<input type="file" id="import-investors-input" accept=".csv,.json,text/csv,application/json" /></label>
        <button class="ghost-btn" data-action="reload-data">Reload</button>
        <button class="ghost-btn" data-action="toggle-theme"><span id="theme-toggle-label">Light UI</span></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-titles">
        <h1 id="view-title">Overview</h1>
        <div id="view-subtitle" class="subtitle"></div>
      </div>
      <div class="topbar-actions">
        <button class="primary-btn" id="primary-action-btn" data-action="add-project">New project</button>
        <button class="icon-btn" id="menu-btn" data-action="toggle-menu" title="Menu">&#8943;</button>
        <div id="menu" class="menu hidden">
          <button data-action="reload-data">Reload from backend</button>
          <button data-action="export-json">Export JSON backup</button>
          <button data-action="export-csv">Export CSV</button>
          <button data-action="toggle-theme"><span id="theme-toggle-label-menu">Toggle theme</span></button>
        </div>
      </div>
    </header>

    <section id="view-overview" class="view"></section>
    <section id="view-tracker" class="view hidden"></section>
    <section id="view-calendar" class="view hidden"></section>
    <section id="view-directory" class="view hidden"></section>
    <section id="view-tasks" class="view hidden"></section>
  </div>
</div>

<div id="detail-backdrop" class="overlay hidden"></div>
<aside id="detail-drawer" class="drawer hidden">
  <div class="drawer-head">
    <div>
      <h2 id="detail-name"></h2>
      <div id="detail-meta" class="subtitle"></div>
    </div>
    <button class="icon-btn" id="detail-close" title="Close">&#10005;</button>
  </div>
  <div id="detail-body" class="drawer-body"></div>
</aside>

<div id="modal-backdrop" class="overlay hidden">
  <div class="modal">
    <form id="modal-form" novalidate>
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" id="modal-close" title="Close">&#10005;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <div id="modal-error" class="modal-error hidden"></div>
        <button type="button" class="ghost-btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="primary-btn" id="modal-submit">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="conflict-backdrop" class="overlay hidden">
  <div class="card-dialog">
    <h2>Someone else saved first</h2>
    <p id="conflict-text"></p>
    <div class="dialog-actions">
      <button class="primary-btn" id="conflict-overwrite">Save mine over theirs</button>
      <button class="ghost-btn" id="conflict-reload">Discard mine, load theirs</button>
    </div>
  </div>
</div>

<div id="fatal-backdrop" class="overlay hidden">
  <div class="card-dialog">
    <h2 id="fatal-title">Cannot open data</h2>
    <p id="fatal-text"></p>
    <div class="dialog-actions">
      <button class="primary-btn" id="fatal-retry">Try again</button>
    </div>
  </div>
</div>

<div id="access-overlay" class="overlay hidden">
  <div class="card-dialog">
    <h2>Open your private access link</h2>
    <p>This device does not have a valid access key. Open the private link you were given to enter the CRM. If your key was revoked, ask for a new link.</p>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="config.js"></script>
<script src="util.js"></script>
<script src="migration.js"></script>
<script src="persistence.js"></script>
<script src="views.js"></script>
<script src="modals.js"></script>
<script src="app.js"></script>
</body>
</html>
